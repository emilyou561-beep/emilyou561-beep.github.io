:root{--bg:#060708;--ink:#e9ecee;--mute:#8d949c;--line:rgba(255,255,255,.1);--led:#5ff0ff;--neon:#ff4fc8;--warm:#ffc68a;--panel:rgba(10,11,13,.94);--f:'Geist',system-ui,sans-serif;--m:'Geist Mono',ui-monospace,monospace}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--led);outline-offset:2px;border-radius:4px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gl.hover{cursor:pointer}

/* chrome */
.top{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px max(2vw,14px);z-index:20;pointer-events:none;opacity:0;transition:opacity .8s}
body.on .top{opacity:1}
.top>*{pointer-events:auto}
.brand{font-weight:600;letter-spacing:.01em;font-size:15px;display:flex;align-items:center;gap:10px;min-height:44px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 10px var(--neon),0 0 2px #fff}
nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
nav a{text-decoration:none;font-size:14px;padding:10px 14px;border-radius:999px;color:var(--mute);transition:color .2s,background .2s;min-height:44px;display:flex;align-items:center}
nav a:hover{color:var(--ink)}
nav a[aria-current=page]{color:#0b0c0e;background:var(--ink)}
.hint{position:fixed;left:max(2vw,14px);bottom:14px;font:12px/1.4 var(--m);color:var(--mute);z-index:20;opacity:0;transition:opacity .8s;pointer-events:none}
body.on.home .hint{opacity:.8}
.back{position:fixed;right:max(2vw,14px);bottom:12px;z-index:22;font:13px var(--m);color:var(--mute);padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(8,9,10,.7);display:none;min-height:44px}
body.in-page .back{display:block}
.rainbtn{position:fixed;left:max(2vw,14px);bottom:12px;z-index:22;font:12px var(--m);color:var(--mute);padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(8,9,10,.6);min-height:40px;opacity:0;transition:opacity .8s,color .2s}
body.on .rainbtn{opacity:1}
.rainbtn:hover{color:var(--ink)}
.rainbtn[aria-pressed=true]{color:#bdf6ff;border-color:rgba(79,240,255,.35)}
body.flat .rainbtn{display:none}
.back:hover{color:var(--ink)}

/* tags pinned to objects on the overview */
.tag{position:fixed;left:0;top:0;z-index:15;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0;transition:opacity .4s}
body.on.home .tag.show{opacity:1}
.tag button{pointer-events:auto;font:500 12px var(--m);color:rgba(233,236,238,.82);background:rgba(10,8,18,.45);border:1px solid rgba(255,79,200,.45);backdrop-filter:blur(4px);padding:6px 11px;border-radius:999px;white-space:nowrap;min-height:30px;transition:color .2s,border-color .2s,box-shadow .2s;box-shadow:0 0 10px rgba(255,79,200,.18)}
.tag button:hover{color:#fff;border-color:var(--neon);box-shadow:0 0 16px rgba(255,79,200,.5)}
.tag span{width:1px;height:16px;background:linear-gradient(rgba(255,79,200,.6),transparent)}
.tip{position:fixed;z-index:16;pointer-events:none;font:12px var(--m);color:var(--ink);background:rgba(8,9,10,.85);border:1px solid var(--line);padding:5px 9px;border-radius:6px;opacity:0;transition:opacity .15s;white-space:nowrap}
.tip.show{opacity:1}

/* pages laid onto screens */
.page{position:fixed;z-index:18;opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s;color:var(--ink)}
.page.show{opacity:1;visibility:visible;transition:opacity .6s .05s}
.screen{background:#08090b;border-radius:4px;overflow:hidden;display:flex;flex-direction:column;font-size:var(--fs,15px)}
.bar{display:flex;align-items:center;gap:10px;padding:.5em .9em;border-bottom:1px solid var(--line);font:400 .78em var(--m);color:var(--mute);flex:none}
.bar b{font-weight:500;color:var(--ink)}
.dots{display:flex;gap:6px}.dots i{width:.6em;height:.6em;border-radius:50%;background:#2a2d31}
.bar .sp{flex:1}
.ib{min-width:32px;min-height:32px;border-radius:6px;display:grid;place-items:center;color:var(--ink);border:1px solid var(--line)}
.ib:hover{background:#16181b}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:#2a2d31 transparent}

/* projects */
.proj{flex:1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:0}
.proj figure{margin:0;background:#0d0f11;display:grid;place-items:center;padding:1.1em;border-right:1px solid var(--line);min-height:0}
.proj figure img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px;background:#fff}
.proj .txt{padding:1.1em 1.3em 1.2em;min-height:0}
.ctx{font:.76em var(--m);color:var(--mute);margin:0 0 .4em}
.proj h2{font-size:1.5em;line-height:1.1;margin:0 0 .45em;font-weight:600;text-wrap:balance}
.proj p{margin:0 0 .9em;color:#c9ced3;font-size:.92em}
.mets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5em;margin:0 0 .9em}
.mets div{border:1px solid var(--line);border-radius:6px;padding:.55em .6em}
.mets b{display:block;font:600 1.15em var(--f);white-space:nowrap;color:var(--ink)}
.mets span{display:block;font-size:.72em;line-height:1.35;color:var(--mute);margin-top:.2em}
.chips{display:flex;flex-wrap:wrap;gap:.35em;margin:0 0 .9em}
.chips span{font:.72em var(--m);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:.2em .65em}
.lnks{display:flex;flex-wrap:wrap;gap:.5em}
.lnks a{font-size:.82em;text-decoration:none;padding:.45em .85em;border-radius:6px;background:#15171a;border:1px solid var(--line)}
.lnks a:hover{background:var(--ink);color:#0b0c0e}
.pager{display:flex;gap:6px;align-items:center}
.pager .n{min-width:3.2em;text-align:center}

/* experience: the side screen */
.cv{padding:1em 1.15em 1.4em;font-size:.9em}
.cv h3{font:500 .78em var(--m);color:var(--neon);margin:1.3em 0 .7em;letter-spacing:.02em}
.cv h3:first-child{margin-top:.2em}
.job{margin:0 0 1.1em;padding-left:.9em;border-left:1px solid var(--line)}
.job h4{margin:0;font-size:1.05em;font-weight:600;line-height:1.25}
.job .meta{font:.74em var(--m);color:var(--mute);margin:.2em 0 .45em}
.job ul{margin:0;padding-left:1.05em;color:#c9ced3}
.job li{margin:.25em 0;font-size:.92em}
.edu{display:grid;gap:.6em}
.edu div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2em 1em}
.edu b{font-weight:600}.edu span{color:var(--mute);font-size:.88em}.edu em{font:normal .74em var(--m);color:var(--mute);white-space:nowrap}
.sk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.35em .9em;font-size:.9em}
.sk dt{font:.8em var(--m);color:var(--mute);padding-top:.15em}.sk dd{margin:0;color:#c9ced3}
.cv .lnks{margin-top:1.2em}

/* about: the journal */
#about{right:max(3vw,16px);top:72px;bottom:64px;width:min(440px,42vw)}
.journal{height:100%;background:#e8e5df;color:#18191b;border-radius:6px 10px 10px 6px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 6px 0 0 #111;display:flex;flex-direction:column}
.journal .scroll{padding:26px 28px 28px 34px;flex:1;scrollbar-color:#bbb transparent}
.hello{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hello img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid #18191b}
.hello h2{font:500 34px/1 'Caveat',cursive;margin:0}
.journal p{margin:0 0 12px;font-size:15.5px;line-height:1.6}
.facts{margin:16px 0;border-top:1px dashed #b9b4ab}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed #b9b4ab;font-size:14.5px}
.facts dt{color:#6b6760}.facts dd{margin:0;font-weight:600;text-align:right}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.thumbs button{aspect-ratio:1;border-radius:4px;overflow:hidden;background:#ccc}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.thumbs button:hover img{transform:scale(1.05)}
.small{font:12px var(--m);color:#6b6760;margin:0 0 6px}
.contact{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.contact a{font-size:14px;text-decoration:none;padding:9px 13px;border-radius:6px;background:#18191b;color:#e8e5df;min-height:40px;display:inline-flex;align-items:center}
.contact a:hover{background:#000}
.mail{font:13px var(--m);margin:10px 0 0;color:#18191b;user-select:all}

/* lightbox, toast */
.lb{position:fixed;inset:0;z-index:40;background:rgba(3,3,4,.9);display:none;place-items:center;padding:4vh 4vw}
.lb.show{display:grid}
.lb figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;max-height:92vh}
.lb img{max-width:92vw;max-height:80vh;border:10px solid #f2f0ec;border-bottom-width:12px;box-shadow:0 20px 60px #000}
.lb figcaption{font:500 26px 'Caveat',cursive;color:#f2f0ec}
.lb .ib{position:absolute;top:16px;right:16px;width:44px;height:44px;background:#111}
.toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,20px);z-index:30;background:rgba(10,11,13,.95);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:14px;max-width:min(420px,90vw);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font:500 13px var(--f);background:var(--ink);color:#0b0c0e;padding:7px 12px;border-radius:6px;white-space:nowrap}

/* boot screen */
#boot{position:fixed;inset:0;z-index:50;background:#000;color:#cfd6d4;font:14px/1.7 var(--m);padding:max(6vh,28px) max(6vw,22px);cursor:pointer;transition:opacity 1.1s}
#boot.gone{opacity:0;pointer-events:none}
#boot pre{margin:0;white-space:pre-wrap;font:inherit}
#boot .ok{color:var(--led)}
#boot .go{margin-top:1.6em;color:#fff}
#boot .cur{display:inline-block;width:.6em;height:1.1em;background:#cfd6d4;vertical-align:-3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* film grain + vignette */
.grain{position:fixed;inset:-50%;z-index:12;pointer-events:none;opacity:.07;animation:gr 1s steps(6) infinite}
.vig{position:fixed;inset:0;z-index:11;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
@keyframes gr{0%{transform:translate(0,0)}20%{transform:translate(-8%,4%)}40%{transform:translate(5%,-6%)}60%{transform:translate(-3%,8%)}80%{transform:translate(7%,2%)}100%{transform:translate(0,0)}}
@media(prefers-reduced-motion:reduce){.grain{animation:none}#boot .cur{animation:none}}

/* small screens: pages become sheets */
@media(max-width:760px),(max-aspect-ratio:1/1){
  .page.sheet{left:10px!important;right:10px!important;top:auto!important;bottom:62px!important;width:auto!important;height:min(70vh,640px)!important}
  #about{left:10px;right:10px;top:auto;bottom:62px;width:auto;height:min(68vh,620px)}
  .proj{grid-template-columns:minmax(0,1fr);overflow:auto}
  .proj figure{border-right:0;border-bottom:1px solid var(--line);max-height:34vh}
  .proj figure img{max-height:28vh}
  .mets{grid-template-columns:minmax(0,1fr)}
  .mets div{display:flex;gap:.8em;align-items:baseline}
  .mets span{margin:0}
  nav a{padding:10px 10px;font-size:13px}
  .hint{display:none}
}

/* no WebGL: everything as one plain page */
body.flat{overflow:auto}
body.flat #gl,body.flat .tag,body.flat .grain,body.flat .vig,body.flat #boot,body.flat .back{display:none}
body.flat .top{position:sticky;opacity:1;background:#060708}
body.flat .page{position:static;opacity:1;visibility:visible;width:auto!important;height:auto!important;margin:16px max(4vw,12px)}
body.flat .proj{grid-template-columns:minmax(0,1fr)}
body.flat #about .journal{height:auto}
